# spotine configuration
# place this file at ~/.config/spotine/config.toml

# --- theme ---
# built-in themes: terminal (default), dracula, iceberg, monokai, solarized-dark,
#                  solarized-light, nord, gruvbox, tokyo-night, catppuccin, rose-pine, mono
# "terminal" reads your terminal's foreground color and uses it as the accent.
[theme]
# name = "terminal"

# custom colors (hex or terminal 256-color number)
# overrides the named theme if both are set
# accent      = "#84a0c6"
# selected_fg = "#c6c8d1"
# filter_fg   = "#89b8c2"

# --- icons ---
# defaults use Nerd Fonts (nf-md-*); change to plain text if unavailable
[icons]
# play    = "▶"
# pause   = "⏸"
# volume  = "V"
# shuffle = "S"

# --- spotify ---
# client_id and client_secret can be set here instead of env vars
# environment variables (SPOTIFY_CLIENT_ID etc.) take precedence
[spotify]
# client_id     = ""
# client_secret = ""
# redirect_uri  = "http://127.0.0.1:8888/callback"
# search_limit  = 10   # search results per query (max 10)

# --- albums ---
# an artist's catalogue usually carries several pressings of the same record:
# the original, a remaster, a deluxe edition. by default every one is listed.
# set collapse_reissues to keep only the original of each and hide the rest.
[albums]
# collapse_reissues = false

# --- ui ---
[ui]
# which browser the popup opens in: "playlist" or "album"
# the -p / -a flags override this for a single run
# default_mode  = "playlist"
# tick_interval = 2   # playback polling interval in seconds

# spotify returns names in the language you ask for, where it has them: with
# a japanese locale sakanaction reads as サカナクション and 米津玄師 keeps its
# kanji. left empty this follows $LANG; set a tag like "ja-JP" or "en" to fix
# it, or "none" to take whatever spotify considers canonical.
# language      = ""
